<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KK Store">
<title>Krispy Kreme</title>
<link rel="icon" type="image/png" sizes="32x32" href="/kk/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/kk/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/kk/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* instant first paint while Google loads the app frame (~2–3 s) */
  #splash { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 2; transition: opacity .25s; }
  #splash img { width: 260px; max-width: 70vw; height: auto; }
  #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #e8efe9; overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #CF112B; border-radius: 4px; animation: kkb 1s ease-in-out infinite; }
  /* store brief video on open (user, 25 Oct): plays over the app while it loads, until watched to the end once; off after 1 Nov */
  #intro { position: fixed; inset: 0; background: #000; z-index: 3; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
  #intro video { width: 100%; height: 100%; object-fit: contain; }
  #intro button { position: absolute; border: 0; border-radius: 20px; padding: 9px 16px; font: 700 14px -apple-system, system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
  #intro .skip { z-index: 2; top: calc(env(safe-area-inset-top) + 14px); right: 14px; }
  #intro .snd { bottom: calc(env(safe-area-inset-bottom) + 22px); left: 50%; transform: translateX(-50%); background: #CF112B; }
  @keyframes kkb { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
</style>
</head>
<body>
<!-- Copy of the KK Store App wrapper (repo abhilashbishtwork/kk) served from the KK website; same origin, so logins are shared with /kk/. KK Store App wrapper: keeps the login in this page's own (first-party) storage, which phones don't wipe,
     and passes it to the Apps Script app inside the frame. Only these keys are ever stored. -->
<div id="splash"><img src="/kk/logo.png" alt="Krispy Kreme"><div class="bar"><i></i></div></div>
<div id="intro" hidden><video id="introV" src="/kk/trick-or-treat.mp4" muted playsinline autoplay preload="auto"></video><button class="skip" type="button">Skip ›</button><button class="snd" type="button">🔊 Tap for sound</button></div>
<iframe id="app" title="Krispy Kreme" allow="camera *; geolocation *; clipboard-write *"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbyhuHvYbgM0jlcLgh_jwxjoc09AkN2C2gREc2ekBigV9UGBok8a11K6N4S2YlU2TvZS/exec';
  var KEYS = ['kkAuth', 'kkBoot', 'kkToday'], lastReload = 0;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  (function () {
    var box = document.getElementById('intro'), v = document.getElementById('introV');
    // plays for everyone on every open / refresh until 31 Oct (user 29 Oct); Skip stays visible throughout
    if (Date.now() > new Date('2026-11-01T00:00:00+05:30').getTime()) { box.remove(); return; }
    box.hidden = false;
    function close(done) { if (done) { try { localStorage.setItem('kkIntroTT', '1'); } catch (e) {} } v.pause(); box.style.opacity = 0; setTimeout(function () { box.remove(); }, 320); }
    var snd = box.querySelector('.snd');
    box.querySelector('.skip').onclick = function () { close(false); };   // Skip always on screen (user 29 Oct)
    snd.onclick = function () { v.muted = false; v.play(); snd.remove(); };
    v.addEventListener('ended', function () { close(true); });
    v.addEventListener('error', function () { close(false); });
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  })();
  // the login is handed to the app by postMessage (kkGet below), never in the URL
  document.getElementById('app').src = EXEC + '?wt=1';
  // hide the splash once the app inside the frame has painted (it posts kkGet on boot); fallback after 8 s
  function hideSplash() { var s = document.getElementById('splash'); if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 300); } }
  setTimeout(hideSplash, 8000);
  window.addEventListener('message', function (e) {
    // only the Apps Script sandbox frame that lives INSIDE our own iframe may talk to this page
    if (!/^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var app = document.getElementById('app').contentWindow, w = e.source, mine = false;
    for (var i = 0; i < 4 && w; i++) { if (w === app) { mine = true; break; } if (w === w.parent) break; w = w.parent; }
    if (!mine) return;
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (Array.isArray(d.kkSet) && KEYS.indexOf(d.kkSet[0]) >= 0 && (d.kkSet[1] === null || typeof d.kkSet[1] === 'string')) {
      try { if (d.kkSet[1] === null) localStorage.removeItem(d.kkSet[0]); else localStorage.setItem(d.kkSet[0], d.kkSet[1]); } catch (x) {}
    }
    if (d.kkReload === 1 && Date.now() - lastReload > 60000) { lastReload = Date.now(); var fr = document.getElementById('app'); try { fr.contentWindow.location.replace(EXEC + '?wt=1&v=' + Date.now()); } catch(e){ fr.src = EXEC + '?wt=1&v=' + Date.now(); } return; }   // newer app build live
    if (Array.isArray(d.kkGet)) { setTimeout(hideSplash, 150);
      var out = {};
      d.kkGet.forEach(function (k) { if (KEYS.indexOf(k) >= 0) out[k] = get(k); });
      e.source.postMessage({ kkVals: out }, e.origin);
    }
  });
</script>
</body>
</html>
